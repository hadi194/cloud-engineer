server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router support — serve index.html for all non-file routes
    # Without this, refreshing /dashboard returns 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* to Go backend (same as Vite proxy does in dev)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy /auth/* to Go backend
    location /auth/ {
        proxy_pass http://backend:8080/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
